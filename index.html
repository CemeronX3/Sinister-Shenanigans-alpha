<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Sinister Shenanigans (alpha)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=PT+Mono&display=swap">
<style>
/* Layout: one game screen centered on a dark field, controls strip under it. Single dark look on purpose. */
:root{
  --bg:#18171a; --frame:#38353c; --ink:#efeae2; --muted:#8d8890; --acid:#b6f24a; --ember:#ff7a1a;
  --font-d:"Russo One", Impact, "Arial Black", sans-serif; --font-m:"PT Mono", ui-monospace, Consolas, monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-m);box-sizing:border-box;margin:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
#wrap{width:100%;max-width:min(1440px,calc((100vh - 70px) * 1.6))}
canvas{display:block;width:100%;height:auto;aspect-ratio:8/5;background:#141316;border:2px solid var(--frame);cursor:crosshair;outline:none}
canvas:focus-visible{border-color:var(--acid)}
.keys{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px;font-size:12px;color:var(--muted);max-width:100%}
.keys b{color:var(--ink);font-weight:400;font-family:var(--font-d);letter-spacing:.04em;font-size:11px}
.tc [hidden],[hidden]{display:none!important}
.tc{display:none;position:fixed;inset:0;pointer-events:none;z-index:5;font-family:var(--font-d)}
body.touch{touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body.touch .tc{display:block}
body.touch .keys{display:none}
body.touch #wrap{max-width:min(1440px,calc((100vh - 20px) * 1.6))}
canvas{touch-action:none}
@media (orientation:portrait){body.touch{justify-content:flex-start;padding-block:max(12px,env(safe-area-inset-top,0px)) 12px}}
.stick{position:absolute;bottom:max(14px,env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;pointer-events:auto;touch-action:none;
  background:rgba(24,23,26,.45);border:2px solid rgba(182,242,74,.55)}
.stick.l{left:max(14px,env(safe-area-inset-left,0px))}.stick.r{right:max(14px,env(safe-area-inset-right,0px))}
.knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(239,234,226,.8);pointer-events:none}
.stick span{position:absolute;left:0;right:0;top:-20px;text-align:center;font-size:11px;letter-spacing:.06em;color:rgba(239,234,226,.7)}
.tb{position:absolute;width:58px;height:58px;border-radius:50%;pointer-events:auto;touch-action:none;display:grid;place-items:center;
  background:rgba(24,23,26,.55);border:2px solid rgba(239,234,226,.55);color:var(--ink);font-size:13px;letter-spacing:.04em}
.tb.on{background:rgba(239,234,226,.35)}
.tb.shield{right:calc(max(14px,env(safe-area-inset-right,0px)) + 134px);bottom:max(18px,env(safe-area-inset-bottom,0px))}
.tb.q{right:calc(max(14px,env(safe-area-inset-right,0px)) + 134px);bottom:calc(max(18px,env(safe-area-inset-bottom,0px)) + 68px)}
.tb.ult{right:calc(max(14px,env(safe-area-inset-right,0px)) + 31px);bottom:calc(max(14px,env(safe-area-inset-bottom,0px)) + 136px);border-color:rgba(255,122,26,.5);color:#ffb070}
.tb.ult.ready{background:rgba(255,122,26,.75);border-color:#ff7a1a;color:#1a1310;animation:pulse .6s ease-in-out infinite alternate}
.tb.e{left:calc(max(14px,env(safe-area-inset-left,0px)) + 134px);bottom:max(18px,env(safe-area-inset-bottom,0px));border-color:rgba(182,242,74,.7);color:var(--acid)}
.tb.f{left:calc(max(14px,env(safe-area-inset-left,0px)) + 134px);bottom:calc(max(18px,env(safe-area-inset-bottom,0px)) + 68px);border-color:rgba(42,158,110,.7);color:#4ad98f}
.tb.pause{top:max(10px,env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));width:44px;height:44px}
@media (orientation:portrait){.tb.pause{top:auto;right:auto;left:50%;margin-left:-22px;bottom:max(24px,env(safe-area-inset-bottom,0px))}}
@keyframes pulse{to{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){.tb.ult.ready{animation:none}}
</style>

<div class="keys">

/* ---------- utils ---------- */
const rand=(a,b)=>a+Math.random()*(b-a), randi=(a,b)=>Math.floor(rand(a,b+1)), clamp=(v,a,b)=>v<a?a:v>b?b:v;
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* ---------- save ---------- */
const KEY='warden-wasteland-save-v1';
let save={coins:0,lv:1,hard:false,wins:0,runs:0,char:'warden',tenn:false,tennLv:1,cain:false,cainLv:1,senton:false,sentonLv:1,volume:1};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)save=Object.assign(save,s)}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}}

/* ---------- input ---------- */
const keys=new Set(),pressed=new Set();
const mouse={x:W/2,y:H/2,down:false,rdown:false,clicked:false,rclicked:false};
addEventListener('keydown',e=>{
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  if(!keys.has(e.code))pressed.add(e.code);keys.add(e.code);audioInit();
});
addEventListener('keyup',e=>keys.delete(e.code));

    if(d<o.r){if(d===0){o.y=k.y+k.h+o.r;continue}o.x+=dx/d*(o.r-d);o.y+=dy/d*(o.r-d)}}
  for(const p of room.props||[]){if(p.dead)continue;const dx=o.x-p.x,dy=o.y-p.y,d=Math.hypot(dx,dy)||1,m=o.r+p.r;if(d<m){o.x+=dx/d*(m-d);o.y+=dy/d*(m-d)}}
  let maxX=A.x+A.w-o.r;if(isPlayer&&room.exitOpen&&room.kind!=='lobby'&&Math.abs(o.y-MIDY)<40)maxX=A.x+A.w+20;
  o.x=clamp(o.x,A.x+o.r,maxX);o.y=clamp(o.y,A.y+o.r,A.y+A.h-o.r)}

  ctx.translate(x,y);ctx.rotate(ang);ctx.scale(scale,scale);
  ctx.beginPath();
  ctx.moveTo(-10,-7);ctx.lineTo(12,0);ctx.lineTo(-10,7);ctx.lineTo(-4,0);ctx.closePath();
  ctx.strokeStyle='#6b7078';ctx.lineWidth=5;ctx.lineJoin='round';ctx.stroke();
  ctx.fillStyle='#17151a';ctx.fill();
  ctx.strokeStyle='#efeae2';ctx.lineWidth=1;ctx.stroke();
  ctx.restore();
}

const CT_W=56, CT_H=260, CT_RELOAD_SCALE=0.58;
const CT_GB_COLS=['#ff2a22','#2a6bff','#8fe62a','#efeae2','#0c0b0d'];
function ctMakeBars(count,lenMin,lenMax){
  const arr=[];
  for(let i=0;i<count;i++)arr.push({
    x:rand(-CT_W*.18,CT_W*.18), y:rand(14,CT_H-14),
    len:rand(lenMin,lenMax), h:rand(2.6,3.8),
    col:CT_GB_COLS[Math.floor(Math.random()*CT_GB_COLS.length)], on:true, next:rand(0,260)
  });
  return arr;
}
function ctUpdBars(arr,dt){
  for(const b of arr){b.next-=dt*1000;
    if(b.next<=0){b.next=rand(110,260);b.on=Math.random()>.1;
      b.col=CT_GB_COLS[Math.floor(Math.random()*CT_GB_COLS.length)];
      b.x=rand(-CT_W*.18,CT_W*.18);b.y=rand(14,CT_H-14)}}
}
function ctDrawBars(g,arr){for(const b of arr){if(!b.on)continue;g.fillStyle=b.col;g.fillRect(b.x-b.len/2,b.y-b.h/2,b.len,b.h)}}
const CT_BARS=ctMakeBars(7,CT_W*.55,CT_W*.95);

  g.restore();

function drawCreatorTowerHealBeam(g,x,y,t,targetX,targetY,active,scaleF){
  if(active===false)return;
  const sf=scaleF==null?1:scaleF;
  const hoverBob=Math.sin(t*1.4)*5, hoverY=(-8-44-hoverBob)*sf;
  const sx=x, sy=y+hoverY;
  const dx=targetX-sx, dy=targetY-sy;
  const pulse=.7+Math.sin(t*3.2)*.3;
  g.save();
  g.strokeStyle=`rgba(255,255,255,${.22*pulse})`;g.lineWidth=14;g.lineCap='round';
  g.beginPath();g.moveTo(sx,sy);g.lineTo(targetX,targetY);g.stroke();
  g.strokeStyle=`rgba(255,255,255,${.45*pulse})`;g.lineWidth=6;
  g.beginPath();g.moveTo(sx,sy);g.lineTo(targetX,targetY);g.stroke();
  g.strokeStyle=`rgba(255,255,255,.95)`;g.lineWidth=2.2;
  g.beginPath();g.moveTo(sx,sy);g.lineTo(targetX,targetY);g.stroke();
  const n=6;
  for(let i=0;i<n;i++){
    const ph=((t*0.9)+i/n)%1;
    const px=sx+dx*ph, py=sy+dy*ph;
    const r=2+Math.sin(ph*Math.PI)*2.4, al=Math.sin(ph*Math.PI);
    g.fillStyle=`rgba(255,255,255,${al*.9})`;
    g.beginPath();g.arc(px,py,r,0,6.283);g.fill();
  }
  g.fillStyle=`rgba(255,255,255,${.5+pulse*.3})`;
  g.beginPath();g.arc(sx,sy,4.5+pulse*2,0,6.283);g.fill();
  g.strokeStyle=`rgba(255,255,255,${.5*pulse})`;g.lineWidth=1.5;
  g.beginPath();g.arc(targetX,targetY,7+pulse*3,0,6.283);g.stroke();
  g.restore();
}

function drawCreatorTowerFull(e){

function drawCMAttackFX(b){
  const g=ctx;
  if(b.atk==='barrage'&&b.bDarts){
    for(const d of b.bDarts){if(d.state==='dead')continue;drawMinionDart(d.x,d.y,d.ang,1.6*d.scale,d.alpha)}
  }else if(b.atk==='lines'&&b.bLines){
    for(const ln of b.bLines){
      if(ln.state==='dead')continue;
      const ang=ln.dir>0?0:Math.PI;
      if(ln.state==='warn'){
        const pulse=.45+Math.sin(b.at*10)*.25;
        g.save();g.strokeStyle=`rgba(255,255,255,${pulse})`;g.lineWidth=2;g.setLineDash([10,8]);
        g.beginPath();g.moveTo(A.x,ln.y);g.lineTo(A.x+A.w,ln.y);g.stroke();g.setLineDash([]);g.restore();
        g.save();g.translate(ln.x-ln.dir*26,ln.y);g.rotate(ang);
        g.strokeStyle='#1a1a22';g.lineWidth=4;g.lineCap='round';
        g.beginPath();g.moveTo(-8,0);g.lineTo(8,0);g.moveTo(2,-6);g.lineTo(8,0);g.lineTo(2,6);g.stroke();
        g.restore();
      }
      drawMinionDart(ln.x,ln.y,ang,1.5,1);
    }
  }else if(b.atk==='sniper'){
    const eye=cmEyePos(b);
    const pulse=b.snPhase==='aim'?.5+Math.sin((b.snPhaseT||0)*14)*.2:1;
    const grad=g.createRadialGradient(eye.x,eye.y,2,eye.x,eye.y,46);
    grad.addColorStop(0,`rgba(255,255,255,${.55*pulse})`);grad.addColorStop(1,'rgba(255,255,255,0)');
    g.save();g.fillStyle=grad;g.beginPath();g.arc(eye.x,eye.y,46,0,6.283);g.fill();g.restore();
    if(b.snPhase==='aim'){
      const len=1000,tx=eye.x+Math.cos(b.snAimAngle)*len,ty=eye.y+Math.sin(b.snAimAngle)*len;
      g.save();g.strokeStyle='#ff2a22';g.lineWidth=2;g.setLineDash([10,8]);
      g.globalAlpha=.4+Math.min(1,b.snPhaseT/b.snAimDur)*.5;
      g.beginPath();g.moveTo(eye.x,eye.y);g.lineTo(tx,ty);g.stroke();g.setLineDash([]);g.restore();
      g.save();g.strokeStyle='#ff2a22';g.lineWidth=1.5;
      g.beginPath();g.arc(P.x,P.y-14,10,0,6.283);g.stroke();
      g.beginPath();g.moveTo(P.x-14,P.y-14);g.lineTo(P.x+14,P.y-14);g.moveTo(P.x,P.y-28);g.lineTo(P.x,P.y);g.stroke();
      g.restore();
    }else if(b.snPhase==='fire'){
      const p=b.snPhaseT/b.snFireDur,len=1000;
      const tx=eye.x+Math.cos(b.snFireAngle)*len,ty=eye.y+Math.sin(b.snFireAngle)*len;
      g.save();g.globalAlpha=Math.max(0,1-p*.3);
      g.strokeStyle='rgba(255,255,255,.9)';g.lineWidth=14;g.lineCap='round';
      g.beginPath();g.moveTo(eye.x,eye.y);g.lineTo(tx,ty);g.stroke();
      g.strokeStyle='#fff';g.lineWidth=4;
      g.beginPath();g.moveTo(eye.x,eye.y);g.lineTo(tx,ty);g.stroke();
      g.restore();
    }
  }else if(b.atk==='hope'){
    const tp=cmTorsoPos(b),eye=cmEyePos(b);
    const S=.82,bobE=Math.sin((b.t||0)*1.6)*2;
    const earL={x:tp.x-19*S,y:b.y+bobE-70*S}, earR={x:tp.x+19*S,y:earL.y};
    if(b.hopePhase==='absorb'){
      const N=16,absorbDur=1.5,stagger=absorbDur*.55/N,pDur=absorbDur*.6;
      for(let i=0;i<N;i++){
        const seed=i*137.5,ang=(seed%360)*Math.PI/180,rad=120+((i*53)%90);
        const sx=tp.x+Math.cos(ang)*rad, sy=tp.y+Math.sin(ang)*rad*.6;
        const startAt=i*stagger,p=Math.max(0,Math.min(1,((b.hopePhaseT||0)-startAt)/pDur));
        if(p<=0||p>=1)continue;
        const e2=p*p,px=lerp(sx,tp.x,e2),py=lerp(sy,tp.y,e2),al=Math.sin(p*Math.PI);
        g.save();g.fillStyle=`rgba(255,255,255,${al*.85})`;g.shadowColor='#fff';g.shadowBlur=6;
        g.beginPath();g.arc(px,py,2+al*1.8,0,6.283);g.fill();g.restore();
      }
      const pulse=.3+Math.sin((b.hopePhaseT||0)*8)*.15;
      g.save();g.strokeStyle=`rgba(255,255,255,${pulse})`;g.lineWidth=2;g.setLineDash([4,6]);
      g.beginPath();g.arc(tp.x,tp.y,40+Math.sin((b.hopePhaseT||0)*5)*6,0,6.283);g.stroke();g.setLineDash([]);g.restore();
    }
    const glow=b.hopeGlow||0;
    if(glow>0){
      for(const pt of [eye,earL,earR]){
        const grad=g.createRadialGradient(pt.x,pt.y,0,pt.x,pt.y,16*glow+4);
        grad.addColorStop(0,`rgba(255,255,255,${.9*glow})`);grad.addColorStop(1,'rgba(255,255,255,0)');
        g.save();g.fillStyle=grad;g.beginPath();g.arc(pt.x,pt.y,16*glow+4,0,6.283);g.fill();g.restore();
      }
      const coreR=10+glow*14+Math.sin((b.t||0)*6)*2*glow;
      const grad2=g.createRadialGradient(tp.x,tp.y,0,tp.x,tp.y,coreR*2.2);
      grad2.addColorStop(0,`rgba(255,255,255,${.9*glow})`);grad2.addColorStop(.4,`rgba(255,255,255,${.5*glow})`);grad2.addColorStop(1,'rgba(255,255,255,0)');
      g.save();g.fillStyle=grad2;g.beginPath();g.arc(tp.x,tp.y,coreR*2.2,0,6.283);g.fill();
      g.fillStyle=`rgba(255,255,255,${glow})`;g.beginPath();g.arc(tp.x,tp.y,coreR*.35,0,6.283);g.fill();
      g.restore();
    }
    if(b.hopePhase==='fire'){
      const len=1500;
      const x1=tp.x+Math.cos(b.beamAngle)*len, y1=tp.y+Math.sin(b.beamAngle)*len;
      const x2=tp.x-Math.cos(b.beamAngle)*len, y2=tp.y-Math.sin(b.beamAngle)*len;
      g.save();
      g.strokeStyle='rgba(255,255,255,.28)';g.lineWidth=34;g.lineCap='round';
      g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();
      g.strokeStyle='rgba(255,255,255,.65)';g.lineWidth=14;
      g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();
      g.strokeStyle='#fff';g.lineWidth=5;
      g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();
      g.restore();
    }
  }
}

function pzEndAtk(b){b.atk=null;b.sub=null;b.cd=rand(1.1,1.6)}
function pzChaseTarget(b,dt,tx,ty,maxSpeed,turnRate,accel){
  const dx=tx-b.x,dy=ty-b.y,dist=Math.hypot(dx,dy);
  const desiredAng=Math.atan2(dy,dx),curAng=Math.atan2(b.vy,b.vx);
  let dAng=desiredAng-curAng;dAng=Math.atan2(Math.sin(dAng),Math.cos(dAng));
  const maxTurn=turnRate*dt;dAng=Math.max(-maxTurn,Math.min(maxTurn,dAng));
  const newAng=curAng+dAng;
  const targetSpeed=dist<PZ_SLOW_RADIUS?maxSpeed*(.3+.7*dist/PZ_SLOW_RADIUS):maxSpeed;
  let speed=Math.hypot(b.vx,b.vy);
  speed+=Math.sign(targetSpeed-speed)*Math.min(Math.abs(targetSpeed-speed),accel*dt);
  b.vx=Math.cos(newAng)*speed;b.vy=Math.sin(newAng)*speed;
  b.x=clamp(b.x+b.vx*dt,A.x+120,A.x+A.w-120);b.y=clamp(b.y+b.vy*dt,A.y+100,A.y+A.h-100)}
function pzPointOnTrail(b,d){
  let acc=0;const trail=b.trail;
  for(let i=1;i<trail.length;i++){
    const p0=trail[i-1],p1=trail[i],seg=Math.hypot(p1.x-p0.x,p1.y-p0.y)||0.0001;
    if(acc+seg>=d){const t=(d-acc)/seg;return{x:p0.x+(p1.x-p0.x)*t,y:p0.y+(p1.y-p0.y)*t,dx:p1.x-p0.x,dy:p1.y-p0.y}}
    acc+=seg}
  const last=trail[trail.length-1],prev=trail[trail.length-2]||last;
  return{x:last.x,y:last.y,dx:last.x-prev.x,dy:last.y-prev.y}}
function pzHeadAnchorBase(b){const pt=pzPointOnTrail(b,0);return{x:pt.x,y:pt.y}}
function pzHeadMouthWorldPos(b,ang){

  let py=base.y+PZ_HEAD_LOCAL_OFFSET[0]*Math.sin(ang)+PZ_HEAD_LOCAL_OFFSET[1]*Math.cos(ang);
  const ex=PZ_HEAD_EYE_LOCAL[0],ey=PZ_HEAD_EYE_LOCAL[1];

/* ---- атака 1: нырок за стену ×3, целится прямо в игрока ---- */
function pzSideExitPoint(side,curX,curY){

function drip(g,x0,y0,len,w,t,seed,col,lineCol){
  const wob=Math.sin(t*1.3+seed)*1.4,wob2=Math.sin(t*1.7+seed*1.6)*.8;

  g.quadraticCurveTo(x0+w*.3+wob2,y0+len*.55,x0+wob,y0+len*.88);
  g.quadraticCurveTo(x0+w*.22+wob,y0+len*.97,x0,y0+len);
  g.quadraticCurveTo(x0-w*.22+wob,y0+len*.97,x0-wob,y0+len*.88);
  g.quadraticCurveTo(x0-w*.3+wob2,y0+len*.55,x0-w/2,y0);
  g.closePath();g.fillStyle=col;g.fill();
  if(lineCol){g.beginPath();g.moveTo(x0+w/2,y0);
    g.quadraticCurveTo(x0+w*.3+wob2,y0+len*.55,x0+wob,y0+len*.88);
    g.quadraticCurveTo(x0+w*.22+wob,y0+len*.97,x0,y0+len);
    g.quadraticCurveTo(x0-w*.22+wob,y0+len*.97,x0-wob,y0+len*.88);
    g.quadraticCurveTo(x0-w*.3+wob2,y0+len*.55,x0-w/2,y0);
    g.strokeStyle=lineCol;g.lineWidth=1;g.stroke()}
}

   "двигается вперёд → реплика → двигается вперёд → реплика" именно как попросили. После последней реплики

const DI_LINES=[

function drawErrorSmile(g,x,y){g.save();g.translate(x,y);g.strokeStyle='#efeae2';g.lineWidth=4;g.lineJoin='round';g.lineCap='round';
  const n=9,half=90,tooth=30,lift=34;

/* ---------- комната подхода к главному офису + кат-сцена встречи с Еррором ----------
   вместо прежнего мгновенного попадания в боссфайт при входе на 6 уровень зоны 4, игрок сперва
   оказывается в комнате-предбаннике (по форме и размеру — точная копия арены босса, BOSS_A), идёт
   к двери в глубине, оттуда падает и отталкивает его силуэт Еррора, следует диалог, экран чернеет,
   проступают (и снова гаснут) его фирменные глаз и улыбка — и уже "за кадром" (полностью чёрный
   экран) игрока переносит в настоящую боссовую комнату, где тьма рассеивается и начинается сам бой.
   Силуэт/обводка/глитч-разметка перенесены один в один из этюда error_silhouette_etude.html. */
function poly(g,pts){g.beginPath();pts.forEach((p,i)=>g[i?'lineTo':'moveTo'](p[0],p[1]));g.closePath()}
const ERR_COL='#ff2a22';
function errPos(tw,th,bone){
  const halfW=tw/2,halfH=th/2,minOv=Math.min(6,halfW*.5);
  const xMin=-bone.hw-(halfW-minOv),xMax=bone.hw+(halfW-minOv);
  const yMin=-bone.hh-(halfH-minOv),yMax=bone.hh+(halfH-minOv);
  return{x:bone.x+rand(xMin,xMax),y:bone.y+rand(yMin,yMax)};
}
function pickBone(bones){return bones[Math.floor(Math.random()*bones.length)]}
function initErrGlitch(n,opt){
  const o=opt||{};const fs=o.fontSize||13,tw=fs*1.9,th=fs*1.05;
  const marks=[];
  for(let i=0;i<n;i++){const bone=pickBone(o.bones),p=errPos(tw,th,bone);
    marks.push({x:p.x,y:p.y,rot:rand(-.22,.22),on:true,next:rand(0,500),fs:fs*rand(.8,1.3)})}
  return{marks,opt:o,tw,th};
}
function updErrGlitch(eg,dt){

    if(m.next<=0){m.next=rand(110,400);m.on=Math.random()>.18;m.rot=rand(-.22,.22);m.fs=(o.fontSize||13)*rand(.8,1.3);
      const bone=pickBone(o.bones),p=errPos(eg.tw,eg.th,bone);m.x=p.x;m.y=p.y}}
}
function drawErrGlitch(g,eg){
  g.save();g.textAlign='center';g.textBaseline='middle';
  for(const m of eg.marks){if(!m.on)continue;
    g.save();g.translate(m.x,m.y);g.rotate(m.rot);g.font=`bold ${m.fs}px monospace`;
    g.fillStyle='rgba(42,82,255,.5)';g.fillText('ERR',1.4,0);
    g.fillStyle=ERR_COL;g.fillText('ERR',0,0);g.restore()}
  g.restore();
}

    else{const spd=58,ux=ddx/dist,uy=ddy/dist;P.x+=ux*spd*dt;P.y+=uy*spd*dt;
      P.moving=true;P.walk+=dt*11;
      if(Math.abs(ux)>Math.abs(uy)*.9){P.view='side';P.face=ux<0?-1:1}else P.view=uy<0?'back':'front'}
  }else if(cs.phase==='fall'){
    P.moving=false;P.view='back';P.face=1;
    const fallDur=.5,frac=Math.min(1,cs.t/fallDur),ease=frac*frac;
    cs.sil.footY=(d.y-120)+(landFootY-(d.y-120))*ease;
    updErrGlitch(cs.sil.eg,dt);
    if(frac>=1){cs.phase='push';cs.t=0;cs.pushSX=P.x;cs.pushSY=P.y;cs.pushTX=P.x;cs.pushTY=P.y+170;
      shake=Math.max(shake,14);flashScreen=Math.max(flashScreen,.35);sfx('hit');
      musicPlay('mus/error_cutscene.mp3')} // Еррор встал на пути — именно в этот момент начинается музыка кат-сцены
  }else if(cs.phase==='push'){
    const dur=.45,pt=Math.min(1,cs.t/dur),ease=1-Math.pow(1-pt,3);
    P.x=cs.pushSX+(cs.pushTX-cs.pushSX)*ease;P.y=cs.pushSY+(cs.pushTY-cs.pushSY)*ease;
    P.moving=false;P.view='back';P.face=1;
    updErrGlitch(cs.sil.eg,dt);
    if(pt>=1){cs.phase='dialog';cs.t=0;cs.di={line:0,lineT:0,stepping:false,stepT:0,stepped:false}}
  }else if(cs.phase==='dialog'){
    updErrGlitch(cs.sil.eg,dt);
    const di=cs.di;
    if(di.stepping){
      const dur=.5,pt=Math.min(1,di.stepT/dur),ease=1-Math.pow(1-pt,3);
      di.stepT+=dt;
      P.x=di.stepSX+(di.stepTX-di.stepSX)*ease;P.y=di.stepSY+(di.stepTY-di.stepSY)*ease;
      P.view='back';P.face=1;P.moving=pt<1;if(P.moving)P.walk+=dt*11;
      if(pt>=1){di.stepping=false;di.line++;di.lineT=0}
    }else{
      P.moving=false;P.view='back';P.face=1;
      di.lineT+=dt;
      if(di.lineT>.15&&(mouse.clicked||pressed.has('KeyE')||pressed.has('Enter')||pressed.has('Space'))){
        if(di.line===ERR_DI_STEP_AFTER&&!di.stepped){
          di.stepped=true;di.stepping=true;di.stepT=0;
          di.stepSX=P.x;di.stepSY=P.y;di.stepTX=P.x;di.stepTY=P.y-18;
          sfx('pick');
        }else if(di.line<ERR_DI_LINES.length-1){di.line++;di.lineT=0;sfx('pick')}
        else{cs.phase='transition';cs.t=0;cs.tr={darken:0,eye:0,smile:0}}
      }
    }
  }else if(cs.phase==='transition'){
    P.moving=false;P.view='back';P.face=1;
    updErrGlitch(cs.sil.eg,dt);
    const tr=cs.tr;
    tr.darken=Math.min(1,tr.darken+dt*1.3);
    if(tr.darken>=1)tr.eye=Math.min(1,tr.eye+dt*1.1);
    if(tr.eye>=1)tr.smile=Math.min(1,tr.smile+dt*1.3);
    if(tr.smile>=1&&cs.t>2){cs.phase='fadeout';cs.t=0}
  }else if(cs.phase==='fadeout'){
    // глаз и улыбка гаснут, экран остаётся полностью чёрным — и уже "за кадром" переносим игрока
    // в настоящую боссовую комнату (та же enterRoom(), что и раньше отвечала за боссфайт); тьма над
    // ней рассеивается отдельно, через room.bossFadeIn (см. render())
    updErrGlitch(cs.sil.eg,dt);
    const tr=cs.tr;
    tr.eye=Math.max(0,tr.eye-dt*1.3);tr.smile=Math.max(0,tr.smile-dt*1.3);
    if(tr.eye<=0&&tr.smile<=0){enterRoom();room.bossFadeIn=true}
  }
}
function officeCutHeadPos(cs){
  const d=OFFICE_DOOR,sx=d.x+d.w/2,sy=(cs.sil?cs.sil.footY:d.y+d.h+48)-ERR_SIL_FOOT_OFF*ERR_SIL_SCALE;
  return{x:sx+13*ERR_SIL_SCALE-camX-26,y:sy-67*ERR_SIL_SCALE-camY};
}
function drawOfficeCutsceneUI(){
  const cs=room.officeCutscene;if(!cs)return;
  if(cs.phase==='dialog'&&cs.di&&!cs.di.stepping){
    const txt=ERR_DI_LINES[cs.di.line],a=Math.min(1,cs.di.lineT*5);
    ctx.save();ctx.globalAlpha=a;
    ctx.font=`16px ${FM}`;const boxW=Math.min(900,ctx.measureText(txt).width+48);
    ctx.fillStyle='rgba(8,7,10,.92)';ctx.fillRect(W/2-boxW/2,H-108,boxW,54);
    ctx.strokeStyle=C.red;ctx.lineWidth=2;ctx.strokeRect(W/2-boxW/2,H-108,boxW,54);
    label(txt,W/2,H-76,16,C.red,'center',FM);
    ctx.restore();
    label('ЛКМ / E / ПРОБЕЛ — далее',W-24,H-24,12,Math.floor(time*2)%2?C.ink:C.muted,'right',FM);
  }else if((cs.phase==='transition'||cs.phase==='fadeout')&&cs.tr){
    const tr=cs.tr,hp=officeCutHeadPos(cs),sc=.45;
    if(tr.darken>0){ctx.fillStyle=`rgba(0,0,0,${tr.darken})`;ctx.fillRect(0,0,W,H)}
    if(tr.eye>0){ctx.save();ctx.globalAlpha=tr.eye;drawErrorEye(ctx,hp.x,hp.y,sc);ctx.restore()}
    if(tr.smile>0){ctx.save();ctx.globalAlpha=tr.smile;ctx.translate(hp.x+70*sc,hp.y+80*sc);ctx.scale(sc,sc);drawErrorSmile(ctx,0,0);ctx.restore()}
  }
}

/* ---------- loop ---------- */
function update(dt){time+=dt;cmAnimateEtudeGlitches(dt);touchFrame();shake=Math.max(0,shake-dt*40);flashScreen=Math.max(0,flashScreen-dt);
  if(pressed.has('KeyM')){muted=!muted;if(bossMusic)bossMusic.muted=muted;musVolume()}
  syncPause();
  if(state==='lobby')updLobby(dt);
  else if(state==='charselect'){updCharSelect(dt);updFx(dt)}
  else if(state==='upgrade'){updUpgrade(dt);updFx(dt)}
  else if(state==='run'){if(pressed.has('Escape')&&room.endT==null){paused=!paused}if(paused)updPause();else updRun(dt)}
  else if(state==='choice')updChoice();
  else if(state==='bossgate'){updBossGate(dt);updFx(dt)}
  else if(state==='bosspick'){updBossPick();updFx(dt)}
  else if(state==='diffpick'){updDiffPick(dt);updFx(dt)}
  else if(state==='bosschoice'){updBossChoice(dt);updFx(dt)}
  else if(state==='bosscutchoice'){updBossCutChoice();updFx(dt)}
  else if(state==='settings'){updSettings(dt);updFx(dt)}
  else if(state==='dead'||state==='win'||state==='teaser'){updFx(dt);if(mouse.clicked||pressed.has('KeyE')||pressed.has('Enter'))toLobby()}
  else if(state==='debugIntro')updDebugIntro(dt)}
function render(){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#141316';ctx.fillRect(0,0,W,H);
  ctx.save();if(shake>0)ctx.translate(rand(-shake,shake)*.5,rand(-shake,shake)*.5);
  let renderFailure=null;
  if(room){try{drawWorld()}catch(err){renderFailure=err;console.error('World render:',err)}}ctx.restore();
  try{drawHUD()}catch(err){renderFailure=renderFailure||err;console.error('HUD render:',err)}
  // Render errors are reported to the browser console, not drawn over the arena.
  // The previous debug overlay covered the boss and persisted every frame.
  if(room&&room.officeCutscene)drawOfficeCutsceneUI();
  if(room&&room.bossFadeIn&&room.bossIntro!=null){ctx.fillStyle=`rgba(0,0,0,${room.bossIntro/1.6})`;ctx.fillRect(0,0,W,H)}
  if(flashScreen>0){ctx.fillStyle=`rgba(255,140,60,${flashScreen*.5})`;ctx.fillRect(0,0,W,H)}
  if(state==='upgrade')drawUpgrade();
  if(state==='charselect')drawCharSelect();
  if(state==='bossgate')drawBossGate();
  if(state==='bosspick')drawBossPick();
  if(state==='diffpick')drawDiffPick();
  if(state==='bosschoice')drawBossChoice();
  if(state==='bosscutchoice')drawBossCutChoice();
  if(state==='choice')drawChoice();
  if(state==='run'&&paused)drawPause();
  if(state==='settings')drawSettings();
  if(state==='dead'||state==='win')drawResult();
  if(state==='teaser')drawTeaser();
  if(state==='debugIntro')drawDebugIntro();
  if(muted)label('ЗВУК ВЫКЛ (M)',W-24,H-8,11,C.muted,'right',FM)}
let last=performance.now();
function frame(now){const dt=Math.min(.033,(now-last)/1000);last=now;try{update(dt);render()}catch(err){console.error(err)}pressed.clear();mouse.clicked=false;mouse.rclicked=false;requestAnimationFrame(frame)}

resize();addEventListener('resize',resize);
toLobby();
(document.fonts&&document.fonts.load?Promise.all([document.fonts.load(`20px ${FD}`),document.fonts.load(`14px ${FM}`)]).catch(()=>{}):Promise.resolve()).then(()=>{if(room)room.floor=makeFloor(room)});
requestAnimationFrame(frame);

})();
</script>
