<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sinister Shenanigans — Beta 0.6</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101116;color:#efeae2;font:16px system-ui}main{text-align:center;padding:24px}button{font:inherit;padding:.5em 1em}</style>
<main>
<h1>Sinister Shenanigans</h1>
<p id="status" role="status">Загрузка Beta 0.6…</p>
<button id="retry" hidden>Повторить загрузку</button>
</main>
<script>
const statusLabel=document.getElementById('status');
const retry=document.getElementById('retry');
retry.onclick=()=>location.reload();
async function start(){
  const files=['00','01','02','03'];
  let completed=0;
  const chunks=await Promise.all(files.map(async part=>{
    const response=await fetch('./builds/beta06-warden-scale/part-'+part+'.bin');
    if(!response.ok)throw new Error('HTTP '+response.status);
    const chunk=await response.blob();
    statusLabel.textContent='Загрузка Beta 0.6… '+(++completed)+' / '+files.length;
    return chunk;
  }));
  const decoded=new Blob(chunks).stream().pipeThrough(new DecompressionStream('gzip'));
  const game=await new Response(decoded).text();
  document.open();
  document.write(game);
  document.close();
}
start().catch(()=>{
  statusLabel.textContent='Не удалось загрузить игру.';
  retry.hidden=false;
});
</script>
