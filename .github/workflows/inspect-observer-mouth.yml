name: Inspect Observer mouth drawing
on:
  push:
    paths:
      - '.github/workflows/inspect-observer-mouth.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show Observer drawing fragments
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('game.js').read_text().splitlines()
          for i,line in enumerate(lines):
              if 'tip' in line and ('lineTo' in line or 'moveTo' in line):
                  print('LINE',i+1,repr(line[:1200]))
              if 'observer' in line.lower() and ('mouth' in line.lower() or 'fang' in line.lower()):
                  print('OBSERVER',i+1,repr(line[:1200]))
          PY
